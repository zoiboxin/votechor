<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- VoteChor brand mark: ballot box on amber, ink-dark box, falling white ballot -->
  <defs>
    <linearGradient id="vc-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7b95c"/>
      <stop offset="1" stop-color="#f2a541"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#vc-bg)"/>
  <!-- falling ballot -->
  <g transform="rotate(-10 32 14)">
    <rect x="25" y="4" width="14" height="16" rx="2.5" fill="#ffffff"/>
    <path d="M28.5 12.5l2.6 2.6 4.6-5" stroke="#8c1f28" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- ballot slot lid -->
  <path d="M18 26.5 L46 26.5 L41 20.5 L23 20.5 Z" fill="#1c1a17"/>
  <rect x="28" y="21.5" width="8" height="3" rx="1.5" fill="#f2a541"/>
  <!-- ballot box -->
  <rect x="13" y="26.5" width="38" height="25" rx="4.5" fill="#1c1a17"/>
  <rect x="13" y="26.5" width="38" height="4.5" rx="2.25" fill="#2d2a26"/>
  <!-- checkmark -->
  <path d="M22.5 39.5l6 6 13-13" stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- feet -->
  <rect x="18" y="51.5" width="7" height="4" rx="1.5" fill="#1c1a17"/>
  <rect x="39" y="51.5" width="7" height="4" rx="1.5" fill="#1c1a17"/>
</svg>
